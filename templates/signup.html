<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Bank - Sign Up</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> 
</head> 
<body> 
    <header class="site-header"> 
        <a href="{{ url_for('login') }}" class="brand-link"> 
            <div class="brand-logo">B</div> 
            <span class="brand-name">Transaction Bank</span> 
        </a> 
    </header> 
 
    <main class="card"> 
        <header> 
            <h1>Create Account</h1> 
            <p class="subtitle">Get started with your new bank account today.</p> 
        </header> 
 
         <!-- Form that user can create account --> 
         
        <!-- Full Name part --> 
         <form action="#" method="POST"> 
            <div class="form-group"> 
                <label for="name">Full Name</label> 
                <input  
                    type="text"  
                    id="name"  
                    name="name"  
                    placeholder="John Doe"  
                    required  
                    autocomplete="name" 
                > 
            </div> 
 
            <!-- Email Part --> 
            <div class="form-group"> 
                <label for="email">Email Address</label> 
                <input  
                    type="email"  
                    id="email"  
                    name="email"  
                    placeholder="name@example.com"  
                    required  
                    autocomplete="email" 
                > 
            </div> 
 
            <!-- Password part --> 
            <div class="form-group"> 
                <label for="password">Password</label> 
                <input  
                    type="password"  
                    id="password"  
                    name="password"  
                    placeholder="••••••••"  
                    required  
                    autocomplete="new-password" 
                > 
            </div> 
 
            <!-- Button tu submit --> 
            <button type="submit" class="btn">Sign Up</button> 
        </form> 
 
        <p class="footer-text"> 
            Already have an account?  
            <a href="{{ url_for('login') }}">Log in</a> 
        </p> 
    </main> 
 
    <!-- Footer --> 
    <footer class="site-footer"> 
 
        <p>&copy; 2026 Transaction Bank. All rights reserved.</p> 
        <div class="footer-links"> 
            <a href="#">Privacy Policy</a> 
            <a href="#">Terms of Service</a> 
            <a href="#">Support</a> 
        </div> 
     
    </footer> 
 
</body> 
</html>
