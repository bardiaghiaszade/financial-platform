<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Bank - Sign Up</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> 
</head> 
<body> 
    <header class="site-header"> 
        <a href="{{ url_for('login') }}" class="brand-link"> 
            <div class="brand-logo">B</div> 
            <span class="brand-name">Transaction Bank</span> 
        </a> 
    </header> 
 
    <main class="card"> 
        <header> 
            <h1>Create Account</h1> 
            <p class="subtitle">Get started with your new bank account today.</p> 
        </header> 
 
         <!-- Form that user can create account --> 
         
        <!-- Full Name part --> 
         <form
         id="signupForm" 
         action="{{ url_for('signup') }}" 
         method="POST"> 

            <div class="form-group"> 
                <label for="firstName">First Name</label> 
                <input  
                    type="text"  
                    id="firstName"  
                    name="first_name"  
                    placeholder="John"  
                    required  
                    autocomplete="name" 
                > 
            </div> 
            <div class="form-group"> 
                <label for="lastName">Last Name</label> 
                <input  
                    type="text"  
                    id="lastName"  
                    name="last_name"  
                    placeholder="Doe"  
                    required  
                    autocomplete="name" 
                > 
            </div> 
            <div class="form-group"> 
                <label for="phone">Phone Number</label> 
                <input  
                    type="tel"  
                    id="phone"  
                    name="phone_number"  
                    placeholder="+49 123 45678910"  
                    required  
                    autocomplete="tel" 
                > 
            </div> 
 
            <!-- Email Part --> 
            <div class="form-group"> 
                <label for="email">Email Address</label> 
                <input  
                    type="email"  
                    id="email"  
                    name="email"  
                    placeholder="name@example.com"  
                    required  
                    autocomplete="email" 
                > 
            </div> 

            <div class="form-group"> 
                <label for="username">Username</label> 
                <input  
                    type="text"  
                    id="username"  
                    name="user_name"  
                    placeholder="JohnDoe"  
                    required  
                    autocomplete="username" 
                > 
            </div> 
            
 
            <!-- Password part --> 
            <div class="form-group"> 
                <label for="password">Password</label> 
                <input  
                    type="password"  
                    id="password"  
                    name="password"  
                    placeholder="••••••••"  
                    required  
                    autocomplete="new-password" 
                > 
                <div id="passwordStrength" class="password-strength"></div>
            </div> 

            
            <div class="form-group"> 
                <label for="password">Reenter Password</label> 
                <input  
                    type="password"  
                    id="passwordR"  
                    name="passwordR"  
                    placeholder="••••••••"  
                    required  
                    autocomplete="new-password" 
                > 
            </div> 

            <p id="passwordError" class="form-error"></p>


            <!-- Button tu submit --> 
            <button type="submit" class="btn">Sign Up</button> 
        </form> 
 
        <p class="footer-text"> 
            Already have an account?  
            <a href="{{ url_for('login') }}">Log in</a> 
        </p> 
    </main> 
 
    <!-- Footer --> 
    <footer class="site-footer"> 
 
        <p>&copy; 2026 Transaction Bank. All rights reserved.</p> 
        <div class="footer-links"> 
            <a href="{{ url_for('login') }}">Support</a> 
        </div> 
     
    </footer> 
 
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body> 
</html>
